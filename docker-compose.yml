services:
  roombalab:
    build: .
    container_name: roombalab
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    env_file: .env
    # Fixed layout (overrides .env): server port inside the container (the right side of "ports"),
    # live DB on a Docker volume opened by this container only,
    # Mac-readable copy in ./data/snapshots (shared folder).
    environment:
      PORT: "8080"
      DB_PATH: /db/roombalab.sqlite
      SNAPSHOT_DIR: /data/snapshots
      ARCHIVE_DIR: /data/archive
    volumes:
      - db:/db
      - ./data:/data

volumes:
  db:
